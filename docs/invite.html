<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join my Boba Dash shop</title>
  <style>
    :root { --pink: #FF6B9D; --bg: #FFF8F0; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border: 1px solid #F0E0E0;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
    }
    .cup { font-size: 56px; }
    h1 { font-size: 22px; margin: 12px 0 8px; }
    p { color: #666; line-height: 1.5; }
    .code {
      margin: 20px 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 6px;
      color: var(--pink);
    }
    .btn {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .primary { background: var(--pink); color: #fff; margin-bottom: 10px; }
    .ghost { background: #fff; color: var(--pink); border: 1px solid var(--pink); }
    .hint { font-size: 12px; color: #999; margin-top: 16px; }
    .fallback {
      display: none;
      margin-top: 16px;
      padding: 12px;
      background: #FFF0F5;
      border-radius: 12px;
      color: #333;
      font-size: 14px;
      line-height: 1.5;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="cup">🧋</div>
    <h1>You're invited to Boba Dash</h1>
    <p>Open the game and add this friend with the invite code below.</p>
    <div class="code" id="code">------</div>
    <button class="btn primary" id="openApp" type="button">Open Boba Dash</button>
    <button class="btn ghost" id="copyBtn" type="button">Copy invite code</button>
    <div class="fallback" id="fallback">
      邀请码已复制。手机浏览器打不开未安装的独立 App。<br /><br />
      请切回 <b>Expo Go</b> → <b>Friends</b> → <b>Enter code</b>，粘贴邀请码。
    </div>
    <p class="hint">Expo Go 测试时请用「复制邀请码」，不要指望浏览器直接唤起游戏。</p>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var code = (params.get('code') || '').toUpperCase();
    document.getElementById('code').textContent = code || '------';

    function copyCode() {
      if (!code) return Promise.resolve();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(code);
      }
      return Promise.resolve();
    }

    document.getElementById('copyBtn').onclick = function () {
      copyCode().then(function () {
        document.getElementById('copyBtn').textContent = 'Copied!';
      });
    };

    document.getElementById('openApp').onclick = function () {
      copyCode();
      var custom = 'bobadash://invite?code=' + encodeURIComponent(code);
      var android = /Android/i.test(navigator.userAgent || '');
      if (android) {
        window.location.href = 'intent://invite?code=' + encodeURIComponent(code) +
          '#Intent;scheme=bobadash;end';
      } else {
        window.location.href = custom;
      }
      setTimeout(function () {
        document.getElementById('fallback').style.display = 'block';
      }, 800);
    };
  </script>
</body>
</html>
