<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join my Boba Dash shop</title>
  <style>
    :root { --pink: #FF6B9D; --bg: #FFF8F0; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border: 1px solid #F0E0E0;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
    }
    .cup { font-size: 56px; }
    h1 { font-size: 22px; margin: 12px 0 8px; }
    p { color: #666; line-height: 1.5; }
    .code {
      margin: 20px 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 6px;
      color: var(--pink);
    }
    .btn {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .primary { background: var(--pink); color: #fff; margin-bottom: 10px; }
    .ghost { background: #fff; color: var(--pink); border: 1px solid var(--pink); }
    .hint { font-size: 12px; color: #999; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="cup">🧋</div>
    <h1>You're invited to Boba Dash</h1>
    <p>Open the game and add this friend with the invite code below.</p>
    <div class="code" id="code">------</div>
    <a class="btn primary" id="openApp" href="#">Open Boba Dash</a>
    <button class="btn ghost" id="copyBtn" type="button">Copy invite code</button>
    <p class="hint">If the app doesn't open, install Boba Dash, then enter this code on the Friends tab.</p>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var code = (params.get('code') || '').toUpperCase();
    document.getElementById('code').textContent = code || '------';
    document.getElementById('openApp').href = 'bobadash://invite?code=' + encodeURIComponent(code);
    document.getElementById('copyBtn').onclick = function () {
      if (!code) return;
      navigator.clipboard.writeText(code).then(function () {
        document.getElementById('copyBtn').textContent = 'Copied!';
      });
    };
  </script>
</body>
</html>
